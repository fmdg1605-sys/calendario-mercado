name: Actualizar calendario

on:
  schedule:
    # Todos los días a las 09:00 UTC (~06:00 Buenos Aires). Ajustá si querés otro horario.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # también podés dispararlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Generar data.json
        working-directory: scripts
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python build_data.py --days 21

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "chore: actualizar calendario ($(date -u +%Y-%m-%d))"
          git push
